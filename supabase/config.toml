# Cấu hình Supabase local (`npx supabase start`). Trên cloud, đặt các giá trị Auth tương ứng trong Dashboard.
project_id = "luyenthuyettrinh"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "200MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "30s"
otp_expiry = 3600

# Email Auth (xác thực, đặt lại mật khẩu) qua SMTP của Resend.
# Local mặc định TẮT → email nằm trong Inbucket (http://127.0.0.1:54324), đóng vai mock.
# Trên Supabase Cloud: Dashboard → Auth → SMTP Settings, host smtp.resend.com, port 465, user "resend", password = RESEND_API_KEY.
[auth.email.smtp]
enabled = false
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "no-reply@example.com"
sender_name = "luyenthuyettrinh.com"

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true
